services:
  # VIYO FastAPI Backend
  - type: web
    name: viyo-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LIVEKIT_URL
        value: wss://viyo-vz4rl9o4.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: viyo-c3b64
      - key: VAPID_PUBLIC_KEY
        sync: false

  # VIYO React Web Client
  - type: web
    name: viyo-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_LIVEKIT_URL
        value: wss://viyo-vz4rl9o4.livekit.cloud
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
